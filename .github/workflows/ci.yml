name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        project: [server, mastra]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: ${{ matrix.project == 'server' && 'package-lock.json' || 'integrations/mastra/package-lock.json' }}
      - name: Install server dependencies
        if: matrix.project == 'server'
        run: npm ci
      - name: Test server
        if: matrix.project == 'server'
        run: npm test
      - name: Install Mastra adapter dependencies
        if: matrix.project == 'mastra'
        working-directory: integrations/mastra
        run: npm ci
      - name: Test Mastra adapter
        if: matrix.project == 'mastra'
        working-directory: integrations/mastra
        run: npm test

  container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          tags: artifact-share:test
